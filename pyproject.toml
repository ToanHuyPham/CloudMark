[project]
name = "cloudmark"
version = "0.1.0"
description = "Local-first cloud, VPS, and bare-metal qualification platform"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CloudMark contributors" }]

[project.scripts]
cloudmark = "cloudmark.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudmark*"]
