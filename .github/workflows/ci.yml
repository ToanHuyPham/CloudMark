name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CloudMark
        run: python -m pip install -e ".[quality]"
      - name: Compile Python sources
        run: python -m compileall -q cloudmark scripts
      - name: Lint Python
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m ruff check cloudmark tests_python scripts
      - name: Run non-load-bearing Python tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests_python -v
      - name: Enforce Python coverage floor
        run: python -m coverage report

  dashboard:
    name: Dashboard and contracts / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@00e6b8420246ccf1cdb9825b4a0e59d1ec4072ab # v2.0.0
        with:
          runtime: node@22.23.2
          cache: true
          require-lockfile: true
      - name: Lint dashboard
        run: pnpm run lint
      - name: Type-check dashboard
        run: pnpm run typecheck
      - name: Validate OpenAPI
        run: pnpm run validate:openapi
      - name: Build and test dashboard
        run: pnpm test
