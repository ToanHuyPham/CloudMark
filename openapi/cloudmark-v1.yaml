openapi: 3.1.0
info:
  title: CloudMark Controller API
  version: 0.3.0
  description: Local-first API for machine evidence, benchmark jobs, authenticated agents, and multi-node sessions.
servers:
  - url: http://127.0.0.1:8787/api/v1
components:
  securitySchemes:
    controllerToken:
      type: apiKey
      in: header
      name: X-CloudMark-Token
    agentToken:
      type: apiKey
      in: header
      name: X-CloudMark-Agent-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RunRequest:
      type: object
      required: [suite]
      properties:
        suite: { type: string, enum: [inventory, storage, network] }
        profile: { type: string }
        confirm_write: { type: boolean, default: false }
        confirm_network_load: { type: boolean, default: false }
        session_id: { type: string }
        timeout_seconds: { type: integer, minimum: 30, maximum: 43200 }
    Run:
      type: object
      required: [id, suite, profile, status, request]
      properties:
        id: { type: string }
        suite: { type: string }
        profile: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        phase: { type: [string, "null"] }
        current_job: { type: [string, "null"] }
        completed_steps: { type: integer }
        total_steps: { type: integer }
        heartbeat_at: { type: [string, "null"], format: date-time }
        cancel_requested: { type: boolean }
        runner_version: { type: [string, "null"] }
        methodology_version: { type: [string, "null"] }
        tool_version: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        request: { type: object, additionalProperties: true }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
paths:
  /health:
    get:
      summary: Controller health
      responses:
        "200":
          description: Healthy
  /system:
    get:
      summary: Local inventory and provider evidence
      parameters:
        - in: query
          name: refresh
          schema: { type: boolean }
      responses:
        "200": { description: System evidence }
  /dashboard:
    get:
      summary: Aggregated dashboard payload
      responses:
        "200": { description: Dashboard state }
  /profiles:
    get:
      summary: Benchmark and suitability profiles
      responses:
        "200": { description: Profiles }
  /runs:
    get:
      summary: List recent benchmark runs
      responses:
        "200": { description: Run collection }
    post:
      summary: Submit an asynchronous benchmark run
      security: [{ controllerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: Invalid request or failed safety gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Missing controller token }
  /runs/{runId}:
    get:
      summary: Read one benchmark run
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: Not found }
  /runs/{runId}/cancel:
    post:
      summary: Request cancellation of a queued or running benchmark
      security: [{ controllerToken: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { description: Run is already terminal }
        "401": { description: Missing controller token }
        "404": { description: Run not found }
  /sessions:
    post:
      summary: Create a short-lived multi-node pairing session
      security: [{ controllerToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "201": { description: Session and short-lived join token }
  /sessions/{sessionId}:
    get:
      summary: Read session and participants
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session }
        "404": { description: Not found }
  /sessions/{sessionId}/join:
    post:
      summary: Join an agent with a short-lived session token
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_token, role, system]
              properties:
                join_token: { type: string }
                role: { type: string, enum: [target, generator, replica, peer] }
                name: { type: string }
                endpoint:
                  type: object
                  properties:
                    address: { type: string }
                system: { type: object, additionalProperties: true }
      responses:
        "200": { description: Joined with a unique agent ID and agent credential }
        "403": { description: Invalid token }
  /agents/{agentId}/heartbeat:
    post:
      summary: Refresh an authenticated agent heartbeat
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                system: { type: object, additionalProperties: true }
      responses:
        "200": { description: Agent presence }
        "401": { description: Missing or invalid agent credential }
  /agents/{agentId}/tasks/next:
    post:
      summary: Atomically claim the next task assigned to an agent
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Task object or null }
        "401": { description: Missing or invalid agent credential }
  /agents/{agentId}/tasks/{taskId}/result:
    post:
      summary: Complete or fail a claimed agent task
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, failed] }
                result: { type: object, additionalProperties: true }
                error: { type: string }
      responses:
        "200": { description: Terminal task }
        "401": { description: Missing or invalid agent credential }
        "404": { description: Running task not found for this agent }
