openapi: 3.1.0
info:
  title: CloudMark Controller API
  version: 0.5.0
  description: Local-first API for machine evidence, local and remote benchmark jobs, authenticated agents, and multi-node sessions.
servers:
  - url: http://127.0.0.1:8787/api/v1
components:
  securitySchemes:
    controllerToken:
      type: apiKey
      in: header
      name: X-CloudMark-Token
    agentToken:
      type: apiKey
      in: header
      name: X-CloudMark-Agent-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RunRequest:
      type: object
      required: [suite]
      properties:
        suite: { type: string, enum: [inventory, compute, memory, storage, network, database, web] }
        profile: { type: string }
        agent_id:
          type: string
          description: Optional authenticated Agent target for compute, memory, or storage. Omit to execute on the Controller host.
        confirm_load:
          type: boolean
          default: false
          description: Required for CPU and memory saturation profiles.
        confirm_write: { type: boolean, default: false }
        confirm_network_load: { type: boolean, default: false }
        confirm_database_load:
          type: boolean
          default: false
          description: Required for an ephemeral PostgreSQL dataset and paired pgbench transaction load.
        confirm_web_load:
          type: boolean
          default: false
          description: Required for an ephemeral Nginx service and paired HTTP/TLS request load.
        session_id: { type: string }
        timeout_seconds: { type: integer, minimum: 30, maximum: 43200 }
    Run:
      type: object
      required: [id, suite, profile, status, request]
      properties:
        id: { type: string }
        suite: { type: string }
        profile: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        phase: { type: [string, "null"] }
        current_job: { type: [string, "null"] }
        completed_steps: { type: integer }
        total_steps: { type: integer }
        heartbeat_at: { type: [string, "null"], format: date-time }
        cancel_requested: { type: boolean }
        runner_version: { type: [string, "null"] }
        methodology_version: { type: [string, "null"] }
        tool_version: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        request: { type: object, additionalProperties: true }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
    PairTopology:
      type: object
      required: [scope, source, verification]
      properties:
        scope: { type: string, enum: [undeclared, same-host, same-zone, cross-zone, cross-region, public-internet] }
        source: { type: string, enum: [unavailable, operator-declared] }
        verification:
          type: object
          required: [status, observed_scope, source, reasons]
          properties:
            status: { type: string, enum: [pending, unavailable, derived, confirmed, compatible, contradicted] }
            observed_scope:
              type: [string, "null"]
              enum: [same-zone, cross-zone, cross-region, null]
            source: { type: string, enum: [unavailable, provider-metadata, advertised-endpoint-classification] }
            reasons:
              type: array
              items: { type: string }
    Session:
      type: object
      required: [id, label, status, created_at, expires_at, topology, agents]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [waiting, ready] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        topology: { $ref: "#/components/schemas/PairTopology" }
        agents:
          type: array
          items: { type: object, additionalProperties: true }
    PairingCredential:
      type: object
      required: [id, join_token, expires_at, topology]
      properties:
        id: { type: string }
        join_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
        topology: { $ref: "#/components/schemas/PairTopology" }
    NetworkCampaignCreateRequest:
      type: object
      required: [session_id, profile, target_windows]
      properties:
        label: { type: string, maxLength: 120 }
        session_id: { type: string }
        profile: { type: string, const: network-peer-standard }
        target_windows: { type: integer, minimum: 3, maximum: 30 }
    NetworkCampaignDispatchRequest:
      type: object
      required: [confirm_network_load, confirm_campaign_window]
      properties:
        confirm_network_load: { type: boolean, const: true }
        confirm_campaign_window: { type: boolean, const: true }
    NetworkCampaign:
      type: object
      required: [id, label, status, contract, progress, next_window, evidence_status, claim]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [active, completed] }
        created_at: { type: string, format: date-time }
        contract_version: { type: string, const: network-campaign-v1 }
        profile: { type: string, const: network-peer-standard }
        profile_version: { type: string }
        methodology_version: { type: string }
        session_id: { type: string }
        contract:
          type: object
          description: Immutable Agent-pair, topology, profile, methodology, and UTC-window identity.
          additionalProperties: true
        progress:
          type: object
          required: [valid_windows, target_windows, remaining_windows, attempts, failed_attempts]
          properties:
            valid_windows: { type: integer, minimum: 0 }
            target_windows: { type: integer, minimum: 3, maximum: 30 }
            remaining_windows: { type: integer, minimum: 0 }
            distinct_utc_days:
              type: array
              items: { type: string, format: date }
            valid_run_ids:
              type: array
              items: { type: string }
            attempts: { type: integer, minimum: 0 }
            failed_attempts: { type: integer, minimum: 0 }
            active_run_id: { type: [string, "null"] }
        next_window:
          type: object
          required: [eligible, reason_code, window_number, attempt_number, window_day]
          properties:
            eligible: { type: boolean }
            reason_code: { type: string }
            earliest_at: { type: [string, "null"], format: date-time }
            window_number: { type: integer, minimum: 1 }
            attempt_number: { type: integer, minimum: 1 }
            window_day: { type: string, format: date }
        attempts:
          type: array
          items: { type: object, additionalProperties: true }
        evidence_status: { type: string, enum: [partial, complete] }
        claim:
          type: string
          description: Explicitly limits the result to temporal evidence for one fixed Agent pair.
paths:
  /health:
    get:
      summary: Controller health
      responses:
        "200":
          description: Healthy
  /system:
    get:
      summary: Local inventory and provider evidence
      parameters:
        - in: query
          name: refresh
          schema: { type: boolean }
      responses:
        "200": { description: System evidence }
  /dashboard:
    get:
      summary: Aggregated dashboard payload
      responses:
        "200": { description: Dashboard state }
  /suitability:
    get:
      summary: Evidence-gated workload suitability and provider-readiness evaluation
      description: Returns target-scoped requirement checks with run provenance. Missing evidence is never converted to zero.
      responses:
        "200": { description: Versioned suitability evaluation }
  /provider-comparisons:
    get:
      summary: Same-cohort repeated-window provider observations
      description: Returns descriptive median, P10, P90, worst-value, and stability statistics only for exact provider, SKU, region, operating-system, profile, methodology, topology, and topology-evidence cohorts. Provider ratings remain disabled.
      responses:
        "200": { description: Versioned provider observation report }
  /profiles:
    get:
      summary: Benchmark and suitability profiles
      responses:
        "200": { description: Profiles }
  /network-campaigns:
    get:
      summary: List repeated network evidence campaigns
      responses:
        "200": { description: Network campaign collection }
    post:
      summary: Create an immutable repeated network evidence contract
      description: Requires a ready Target and Generator pair and the network-peer-standard profile. Creation does not start traffic.
      security: [{ controllerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkCampaignCreateRequest" }
      responses:
        "201":
          description: Campaign created without dispatching a Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkCampaign" }
        "400": { description: Invalid or unready immutable contract }
        "401": { description: Missing controller token }
  /network-campaigns/{campaignId}:
    get:
      summary: Read one projected network campaign
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Campaign state and validated UTC-day progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkCampaign" }
        "404": { description: Network campaign not found }
  /network-campaigns/{campaignId}/runs:
    post:
      summary: Manually dispatch the next eligible campaign window
      description: Never scheduled automatically. At most one comparison-eligible standard Run can count per UTC day; failed attempts may be retried.
      security: [{ controllerToken: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkCampaignDispatchRequest" }
      responses:
        "202": { description: Guarded peer Run accepted and campaign projection returned }
        "400": { description: Confirmation missing, UTC window closed, active Run present, or contract changed }
        "401": { description: Missing controller token }
        "404": { description: Network campaign not found }
  /runs:
    get:
      summary: List recent benchmark runs
      responses:
        "200": { description: Run collection }
    post:
      summary: Submit an asynchronous benchmark run
      security: [{ controllerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: Invalid request, failed safety gate, or conflicting local saturation run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Missing controller token }
  /runs/{runId}:
    get:
      summary: Read one benchmark run
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: Not found }
  /runs/{runId}/cancel:
    post:
      summary: Request cancellation of a queued or running benchmark
      security: [{ controllerToken: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { description: Run is already terminal }
        "401": { description: Missing controller token }
        "404": { description: Run not found }
  /sessions:
    post:
      summary: Create a short-lived multi-node pairing session
      security: [{ controllerToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                topology:
                  type: object
                  properties:
                    scope: { type: string, enum: [undeclared, same-host, same-zone, cross-zone, cross-region, public-internet] }
                    source: { type: string, enum: [unavailable, operator-declared] }
      responses:
        "201":
          description: Session and short-lived join token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCredential" }
  /sessions/{sessionId}:
    get:
      summary: Read session and participants
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { description: Not found }
  /sessions/{sessionId}/join:
    post:
      summary: Join an agent with a short-lived session token
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_token, role, system]
              properties:
                join_token: { type: string }
                role: { type: string, enum: [target, generator, replica, peer] }
                name: { type: string }
                endpoint:
                  type: object
                  properties:
                    address: { type: string }
                system: { type: object, additionalProperties: true }
      responses:
        "200": { description: Joined with a unique agent ID and agent credential }
        "403": { description: Invalid token }
  /agents/{agentId}/heartbeat:
    post:
      summary: Refresh an authenticated agent heartbeat
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                system: { type: object, additionalProperties: true }
      responses:
        "200": { description: Agent presence }
        "401": { description: Missing or invalid agent credential }
  /agents/{agentId}/tasks/next:
    post:
      summary: Atomically claim the next task assigned to an agent
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Task object or null }
        "401": { description: Missing or invalid agent credential }
  /agents/{agentId}/tasks/{taskId}/result:
    post:
      summary: Complete or fail a claimed agent task
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, failed, cancelled] }
                result: { type: object, additionalProperties: true }
                error: { type: string }
      responses:
        "200": { description: Terminal task }
        "401": { description: Missing or invalid agent credential }
        "404": { description: Running task not found for this agent }
  /agents/{agentId}/tasks/{taskId}/progress:
    post:
      summary: Publish progress and poll cancellation for a running Agent task
      security: [{ agentToken: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progress, completed_steps, total_steps]
              properties:
                progress: { type: number, minimum: 0, maximum: 1 }
                phase: { type: [string, "null"] }
                current_job: { type: [string, "null"] }
                completed_steps: { type: integer, minimum: 0 }
                total_steps: { type: integer, minimum: 1 }
                result: { type: [object, "null"], additionalProperties: true }
      responses:
        "200":
          description: Progress acceptance and current cancellation decision
        "401": { description: Missing or invalid agent credential }
        "404": { description: Task not found for this agent }
